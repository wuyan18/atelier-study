  <script>
    /* 主题早绑定：在样式表生效前把 data-theme 写到 <html>，避免首帧闪色。
       localStorage "atelier-theme" 是 settings.theme 的镜像（见 js/app.js）。 */
    (function () {
      try {
        var t = localStorage.getItem("atelier-theme") || "auto";
        var dark = t === "dark" || (t === "auto" &&
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { /* 隐私模式等场景下静默降级 */ }
    })();
  </script>
